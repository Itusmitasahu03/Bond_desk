<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bond_Desk | Customer Registration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

    <!-- Background -->
    <div class="register-overlay"></div>

    <!-- Navbar -->
    <nav class="register-navbar">
        <a href="index.html" class="register-logo">
            <i class="fa-solid fa-hotel"></i>
            Bond<span>_Desk</span>
        </a>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </nav>


    <!-- Registration -->
    <div class="register-container">

        <div class="register-card">

            <div class="register-heading">
                <div class="register-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h1>Create Account</h1>

                <p>
                    Register with Bond_Desk and discover comfortable stays
                    anywhere.
                </p>
            </div>


            <form id="registerForm">

                <!-- Name -->
                <div class="input-group-custom">
                    <label>Full Name</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required>
                    </div>
                </div>


                <!-- Email -->
                <div class="input-group-custom">
                    <label>Email Address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>
                    </div>
                </div>


                <!-- Phone -->
                <div class="input-group-custom">
                    <label>Phone Number</label>

                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                            required>
                    </div>
                </div>


                <!-- Location -->
                <div class="input-group-custom">
                    <label>Preferred Location</label>

                    <div class="input-box">
                        <i class="fa-solid fa-location-dot"></i>

                        <input
                            type="text"
                            id="userLocation"
                            placeholder="Example: Bhubaneswar"
                            required>
                    </div>
                </div>


                <!-- Password -->
                <div class="input-group-custom">
                    <label>Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required>

                        <i
                            class="fa-solid fa-eye password-eye"
                            onclick="togglePassword('password', this)">
                        </i>
                    </div>
                </div>


                <!-- Confirm Password -->
                <div class="input-group-custom">
                    <label>Confirm Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required>

                        <i
                            class="fa-solid fa-eye password-eye"
                            onclick="togglePassword('confirmPassword', this)">
                        </i>
                    </div>
                </div>


                <!-- Terms -->
                <div class="terms">
                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the Terms & Conditions and Privacy Policy.
                    </label>
                </div>


                <!-- Register -->
                <button type="submit" class="register-btn">
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>


    <script>

        // Show / Hide Password
        function togglePassword(inputId, icon) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }


        // Registration
        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                // Phone validation
                if (!/^[0-9]{10}$/.test(phone)) {

                    alert("Please enter a valid 10-digit phone number.");

                    return;
                }


                // Password validation
                if (password.length < 6) {

                    alert("Password must contain at least 6 characters.");

                    return;
                }


                // Confirm password
                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }


               alert(
                    "Registration successful, " +
                     name +
                    "!"
                    );

window.location.href = "login.html";


                // Later this will connect to Django
                // window.location.href = "login.html";

            });

    </script>

</body>

</html>
